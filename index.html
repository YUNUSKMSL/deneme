<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annemin Mutfağı - Ne Pişirsem?</title>
    <style>
        :root {
            --primary: #e65100;
            --primary-light: #fff3e0;
            --selected: #2e7d32;
            --selected-bg: #e8f5e9;
            --bg: #fdfbf7;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 20px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Üst Kontrol Barı */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-clear {
            background-color: #ffebee;
            color: #c62828;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
        }

        /* Kategori ve Malzeme Butonları */
        .category-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .category-title {
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 12px;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 6px;
            font-weight: 700;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 10px;
        }

        .ing-btn {
            background-color: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            padding: 14px 10px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
            user-select: none;
        }

        .ing-btn.selected {
            background-color: var(--selected-bg);
            border-color: var(--selected);
            color: var(--selected);
            transform: scale(1.02);
            box-shadow: 0 3px 8px rgba(46, 125, 50, 0.2);
        }

        /* Tarif Sonuçları */
        .results-section {
            margin-top: 25px;
        }

        .results-header {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #222;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recipe-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border-left: 6px solid var(--primary);
        }

        .recipe-card.exact-match {
            border-left-color: var(--selected);
        }

        .recipe-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-exact {
            background-color: var(--selected-bg);
            color: var(--selected);
        }

        .badge-missing {
            background-color: #fff3e0;
            color: #e65100;
        }

        .recipe-ings {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .recipe-steps {
            background-color: #fafafa;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.6;
            color: #333;
        }

        .empty-state {
            text-align: center;
            padding: 35px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            color: #666;
            font-size: 1.1rem;
        }

        /* Yeni Tarif Ekleme Modalı */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🍲 Bugün Ne Pişirsem?</h1>
    <p>Evdeki malzemelere dokun, uygun yemekler listelensin</p>
</header>

<div class="container">
    <div class="top-controls">
        <button class="btn btn-clear" onclick="clearSelection()">🔄 Seçimleri Temizle</button>
        <button class="btn btn-add" onclick="openModal()">➕ Yeni Tarif Ekle</button>
    </div>

    <!-- Malzeme Kategorileri -->
    <div id="categories-container"></div>

    <!-- Tarif Sonuçları -->
    <div class="results-section">
        <h2 class="results-header">📋 Uygun Tarifler <span id="selected-count"></span></h2>
        <div id="recipes-container"></div>
    </div>
</div>

<!-- Yeni Tarif Ekleme Modalı -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Yeni Tarif Ekle</h2>
            <button class="btn btn-clear" onclick="closeModal()" style="padding: 6px 12px;">✖</button>
        </div>
        <div class="form-group">
            <label>Yemeğin Adı:</label>
            <input type="text" id="newRecipeName" placeholder="Örn: Kabak Mücveri">
        </div>
        <div class="form-group">
            <label>Malzemeleri Seçin:</label>
            <div class="ingredients-grid" id="modal-ingredients" style="max-height: 220px; overflow-y: auto; padding: 5px;"></div>
        </div>
        <div class="form-group">
            <label>Yapılışı:</label>
            <textarea id="newRecipeSteps" rows="4" placeholder="Kısaca yapılışını yazın..."></textarea>
        </div>
        <button class="btn btn-add" style="width: 100%; justify-content: center;" onclick="saveNewRecipe()">💾 Tarifi Kaydet</button>
    </div>
</div>

<script>
    // 1. KATEGORİLER VE MALZEMELER (Emoji + İsim)
    const ingredientCategories = [
        {
            name: "🍅 Sebzeler",
            items: [
                { id: "patates", name: "Patates", icon: "🥔" },
                { id: "sogan", name: "Soğan", icon: "🧅" },
                { id: "domates", name: "Domates", icon: "🍅" },
                { id: "biber", name: "Biber", icon: "🌶️" },
                { id: "patlican", name: "Patlıcan", icon: "🍆" },
                { id: "kabak", name: "Kabak", icon: "🥒" },
                { id: "sarimsak", name: "Sarımsak", icon: "🧄" },
                { id: "havuc", name: "Havuç", icon: "🥕" },
                { id: "ispanak", name: "Ispanak", icon: "🥬" }
            ]
        },
        {
            name: "🥩 Et, Tavuk & Şarküteri",
            items: [
                { id: "kiyma", name: "Kıyma", icon: "🥩" },
                { id: "kusbasi", name: "Kuşbaşı Et", icon: "🍖" },
                { id: "tavuk", name: "Tavuk", icon: "🍗" },
                { id: "sucuk", name: "Sucuk", icon: "🌭" }
            ]
        },
        {
            name: "🌾 Bakliyat & Tahıl",
            items: [
                { id: "pirinc", name: "Pirinç", icon: "🍚" },
                { id: "bulgur", name: "Bulgur", icon: "🌾" },
                { id: "mercimek", name: "Mercimek", icon: "🥣" },
                { id: "makarna", name: "Makarna", icon: "🍝" },
                { id: "nohut", name: "Nohut", icon: "🫘" },
                { id: "fasulye", name: "Kuru Fasulye", icon: "🫘" }
            ]
        },
        {
            name: "🧀 Süt, Yumurta & Temel",
            items: [
                { id: "yumurta", name: "Yumurta", icon: "🥚" },
                { id: "yogurt", name: "Yoğurt", icon: "🥛" },
                { id: "sut", name: "Süt", icon: "🥛" },
                { id: "peynir", name: "Peynir", icon: "🧀" },
                { id: "un", name: "Un", icon: "🥡" },
                { id: "salca", name: "Salça", icon: "🥫" }
            ]
        }
    ];

    // Tüm malzemeleri tek bir sözlükte topla (isim bulmayı kolaylaştırmak için)
    const allIngredientsMap = {};
    ingredientCategories.forEach(cat => {
        cat.items.forEach(item => {
            allIngredientsMap[item.id] = `${item.icon} ${item.name}`;
        });
    });

    // 2. VARSAYILAN TARİFLER
    const defaultRecipes = [
        {
            name: "Menemen",
            ingredients: ["domates", "biber", "yumurta", "sogan"],
            steps: "Soğan ve biberleri yağda kavurun. Kabuğu soyulmuş doğranmış domatesleri ekleyip suyunu çekene kadar pişirin. Son olarak yumurtaları kırıp karıştırın."
        },
        {
            name: "Karnıyarık",
            ingredients: ["patlican", "kiyma", "sogan", "domates", "biber", "sarimsak", "salca"],
            steps: "Patlıcanları alacalı soyup kızartın. Kıymayı soğan, sarımsak, biber, domates ve salça ile kavurup iç harcı hazırlayın. Patlıcanların ortasını açıp harcı doldurun ve fırınlayın."
        },
        {
            name: "Mercimek Çorbası",
            ingredients: ["mercimek", "sogan", "havuc", "patates", "salca"],
            steps: "Soğan, havuç ve patatesi doğrayıp mercimekle birlikte üzerini geçecek kadar suyla haşlayın. Pişince blenderdan geçirin, üzerine salçalı tereyağlı sos yakın."
        },
        {
            name: "Tavuk Sote",
            ingredients: ["tavuk", "sogan", "biber", "domates", "sarimsak", "salca"],
            steps: "Kuşbaşı doğranmış tavukları suyunu salıp çekene kadar kavurun. Soğan, sarımsak ve biberleri ekleyin. Salça ve doğranmış domatesleri ilave edip kısık ateşte pişirin."
        },
        {
            name: "Patates Oturtma",
            ingredients: ["patates", "kiyma", "sogan", "salca", "domates", "biber"],
            steps: "Patatesleri halka halka doğrayıp hafif kızartın ve tepsiye dizin. Üzerine soğan, biber ve salçayla kavrulmuş kıymalı harcı yayın. Sıcak su ekleyip fırında pişirin."
        },
        {
            name: "Mücver",
            ingredients: ["kabak", "yumurta", "un", "sogan", "peynir"],
            steps: "Kabakları rendeleyip suyunu iyice sıkın. İçine yumurta, un, ince kıyılmış soğan ve peynir ekleyip karıştırın. Kaşıkla kızgın yağa dökerek iki tarafını kızartın."
        },
        {
            name: "Salçalı Bulgur Pilavı",
            ingredients: ["bulgur", "sogan", "biber", "domates", "salca"],
            steps: "Soğan ve biberi kavurun, salça ve rendelenmiş domatesi ekleyin. Yıkanmış bulguru ilave edip sıcak suyunu verin, kısık ateşte suyunu çekene kadar pişirin."
        },
        {
            name: "Kıymalı Ispanak Yemeği",
            ingredients: ["ispanak", "kiyma", "sogan", "pirinc", "salca"],
            steps: "Soğan ve kıymayı salçayla kavurun. Yıkanıp doğranmış ıspanakları ve bir avuç pirinci ekleyin. Kısık ateşte kendi suyuyla pişmeye bırakın, yoğurtla servis edin."
        },
        {
            name: "Fırında Sütlaç",
            ingredients: ["pirinc", "sut", "yumurta"],
            steps: "Pirinci az suyla haşlayın. Sütü ve şekeri ekleyip kaynatın. Yumurta sarısını sütle ılıştırıp tencereye ekleyin, kaselere paylaştırıp fırının üst rafında üzerini kızartın."
        }
    ];

    let selectedIngredients = new Set();
    let modalSelectedIngredients = new Set();
    let recipes = JSON.parse(localStorage.getItem("annemin_tarifleri")) || defaultRecipes;

    // Sayfa Yüklendiğinde
    function init() {
        renderCategories();
        renderRecipes();
        renderModalIngredients();
    }

    // Kategori ve Malzeme Butonlarını Çiz
    function renderCategories() {
        const container = document.getElementById("categories-container");
        container.innerHTML = "";

        ingredientCategories.forEach(cat => {
            const box = document.createElement("div");
            box.className = "category-box";

            const title = document.createElement("div");
            title.className = "category-title";
            title.textContent = cat.name;
            box.appendChild(title);

            const grid = document.createElement("div");
            grid.className = "ingredients-grid";

            cat.items.forEach(item => {
                const btn = document.createElement("button");
                btn.className = "ing-btn" + (selectedIngredients.has(item.id) ? " selected" : "");
                btn.innerHTML = `<span>${item.icon}</span> <span>${item.name}</span>`;
                btn.onclick = () => toggleIngredient(item.id);
                grid.appendChild(btn);
            });

            box.appendChild(grid);
            container.appendChild(box);
        });
    }

    // Malzeme Seç / Kaldır
    function toggleIngredient(id) {
        if (selectedIngredients.has(id)) {
            selectedIngredients.delete(id);
        } else {
            selectedIngredients.add(id);
        }
        renderCategories();
        renderRecipes();
    }

    // Seçimleri Sıfırla
    function clearSelection() {
        selectedIngredients.clear();
        renderCategories();
        renderRecipes();
    }

    // Tarifleri Eşleştir ve Listele
    function renderRecipes() {
        const container = document.getElementById("recipes-container");
        const countSpan = document.getElementById("selected-count");
        container.innerHTML = "";

        if (selectedIngredients.size === 0) {
            countSpan.textContent = "";
            container.innerHTML = `
                <div class="empty-state">
                    👆 Yukarıdaki malzemelerden elinizde olanlara dokunun.<br>
                    Seçtiğiniz malzemelere göre yapabileceğiniz yemekler burada görünecek.
                </div>`;
            return;
        }

        countSpan.textContent = `(${selectedIngredients.size} malzeme seçildi)`;

        // Tarifleri puanla: Kaç malzemesi eşleşiyor, kaç malzemesi eksik?
        const matchedRecipes = recipes.map(recipe => {
            const matched = recipe.ingredients.filter(ing => selectedIngredients.has(ing));
            const missing = recipe.ingredients.filter(ing => !selectedIngredients.has(ing));
            return {
                ...recipe,
                matchedCount: matched.length,
                missingCount: missing.length,
                missingList: missing
            };
        })
        // En az 1 malzemesi eşleşenleri filtrele
        .filter(r => r.matchedCount > 0)
        // Sıralama: Önce eksik malzemesi en az olanlar, sonra en çok eşleşmesi olanlar
        .sort((a, b) => {
            if (a.missingCount !== b.missingCount) {
                return a.missingCount - b.missingCount;
            }
            return b.matchedCount - a.matchedCount;
        });

        if (matchedRecipes.length === 0) {
            container.innerHTML = `<div class="empty-state">Seçtiğiniz malzemelerle eşleşen bir tarif bulunamadı.</div>`;
            return;
        }

        matchedRecipes.forEach(recipe => {
            const card = document.createElement("div");
            const isExact = recipe.missingCount === 0;
            card.className = "recipe-card" + (isExact ? " exact-match" : "");

            const badgeHTML = isExact
                ? `<span class="badge badge-exact">✅ Tüm Malzemeler Var!</span>`
                : `<span class="badge badge-missing">⚠️ ${recipe.missingCount} Malzeme Eksik</span>`;

            const allIngNames = recipe.ingredients.map(id => {
                const label = allIngredientsMap[id] || id;
                return selectedIngredients.has(id) ? `<strong>${label}</strong>` : label;
            }).join(", ");

            const missingNames = recipe.missingList.map(id => allIngredientsMap[id] || id).join(", ");
            const missingInfo = !isExact ? `<div style="color:#c62828; font-size:0.9rem; margin-bottom:8px;"><strong>Eksik olanlar:</strong> ${missingNames}</div>` : "";

            card.innerHTML = `
                <div class="recipe-title">
                    <span>${recipe.name}</span>
                    ${badgeHTML}
                </div>
                <div class="recipe-ings"><strong>Malzemeler:</strong> ${allIngNames}</div>
                ${missingInfo}
                <div class="recipe-steps"><strong>Yapılışı:</strong> ${recipe.steps}</div>
            `;
            container.appendChild(card);
        });
    }

    // Modal İşlemleri (Yeni Tarif Ekleme)
    function renderModalIngredients() {
        const container = document.getElementById("modal-ingredients");
        container.innerHTML = "";
        Object.keys(allIngredientsMap).forEach(id => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "ing-btn" + (modalSelectedIngredients.has(id) ? " selected" : "");
            btn.style.fontSize = "0.9rem";
            btn.style.padding = "8px";
            btn.innerHTML = allIngredientsMap[id];
            btn.onclick = () => {
                if (modalSelectedIngredients.has(id)) modalSelectedIngredients.delete(id);
                else modalSelectedIngredients.add(id);
                renderModalIngredients();
            };
            container.appendChild(btn);
        });
    }

    function openModal() {
        modalSelectedIngredients.clear();
        document.getElementById("newRecipeName").value = "";
        document.getElementById("newRecipeSteps").value = "";
        renderModalIngredients();
        document.getElementById("addModal").classList.add("active");
    }

    function closeModal() {
        document.getElementById("addModal").classList.remove("active");
    }

    function saveNewRecipe() {
        const name = document.getElementById("newRecipeName").value.trim();
        const steps = document.getElementById("newRecipeSteps").value.trim();

        if (!name || !steps || modalSelectedIngredients.size === 0) {
            alert("Lütfen yemeğin adını yazın, malzemelerini seçin ve yapılışını ekleyin.");
            return;
        }

        recipes.push({
            name: name,
            ingredients: Array.from(modalSelectedIngredients),
            steps: steps
        });

        localStorage.setItem("annemin_tarifleri", JSON.stringify(recipes));
        closeModal();
        renderRecipes();
    }

    init();
</script>

</body>
</html>
